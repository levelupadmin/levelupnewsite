  // --- search scoring (tokenized substring) ---
  function search(rows, q, hayKey, nameKey){
    q=(q||'').trim().toLowerCase(); if(!q) return rows;
    var toks=q.split(/\s+/);
    var out=[];
    for(var i=0;i<rows.length;i++){
      var r=rows[i], hay=r[hayKey], ok=true, sc=0, nm=(r[nameKey]||'').toLowerCase();
      for(var t=0;t<toks.length;t++){ if(hay.indexOf(toks[t])<0){ok=false;break;} }
      if(!ok) continue;
      if(nm===q) sc=100; else if(nm.indexOf(q)===0) sc=60; else if(nm.indexOf(q)>=0) sc=30; else sc=10;
      out.push([sc,r]);
    }
    out.sort(function(a,b){ return b[0]-a[0] || String(a[1][nameKey]).localeCompare(String(b[1][nameKey])); });
    return out.map(function(p){return p[1];});
  }

  // =========================================================

  // =========================================================
  var B = null; // {key, rows, query, facets:{field:Set}, page}
  function computeFacets(rows, def){
    var m={};
    rows.forEach(function(r){
      var v=(r.extra||{})[def.f];
      if(v==null||v==='') return;
      var vals = def.split ? String(v).split(def.split) : [v];
      vals.forEach(function(x){ x=String(x).trim(); if(!x) return;
        var k=x.toLowerCase();                 // merge case-variant tags (Productivity/productivity)
        if(!m[k]) m[k]={n:0,cas:{}};
        m[k].n++; m[k].cas[x]=(m[k].cas[x]||0)+1;
      });
    });
    return Object.keys(m).map(function(k){
      var cas=m[k].cas, best=k, bc=-1;          // display the most common original casing
      for(var c in cas){ if(cas[c]>bc){ bc=cas[c]; best=c; } }
      return {key:k, disp:prettyLabel(best), n:m[k].n};
    }).sort(function(a,b){return b.n-a.n;}).slice(0, def.top||99);
  }
  // --- sort metrics (GitHub stars + dates) ---
  function starN(r){ var s=(r.extra||{}).stars; return (typeof s==='number')?s:-1; }
  function dateN(r){ var e=r.extra||{}; var t=Date.parse(e.created||e.pushed||e.last_updated||''); return isNaN(t)?-1:t; }
  function topScore(r){ var s=starN(r); if(s<0) return -1; var p=Date.parse((r.extra||{}).pushed||(r.extra||{}).created||''); var fresh=1; if(!isNaN(p)){ var months=(Date.now()-p)/2628000000; fresh=1/(1+Math.max(0,months)/18); } return s*fresh; }
  function sortRows(rows,mode){ var a=rows.slice();
    if(mode==='popular') a.sort(function(x,y){return starN(y)-starN(x);});
    else if(mode==='top') a.sort(function(x,y){return topScore(y)-topScore(x);});
    else if(mode==='newest') a.sort(function(x,y){return dateN(y)-dateN(x);});
    else if(mode==='name') a.sort(function(x,y){return String(x.name).localeCompare(String(y.name));});
    return a; }
  function fmtStars(n){ if(n>=1000) return (n/1000).toFixed(n<10000?1:0)+'k'; return ''+n; }
  function cardStatsHTML(r){ var e=r.extra||{}; if(typeof e.stars!=='number') return ''; var up=(e.pushed||e.created||'').slice(0,7); return '<span class="ail-card-stars" title="GitHub stars · last updated">★ '+fmtStars(e.stars)+(up?' · '+up:'')+'</span>'; }
  function applyBrowse(){
    var def=CAT_BY[B.key];
    var rows=B.rows;
    // facets (AND across fields, OR within field)
    def.facets.forEach(function(fd){
      var sel=B.facets[fd.f];
      if(sel && sel.size){
        rows=rows.filter(function(r){
          var v=(r.extra||{})[fd.f]; if(v==null) return false;
          var vals=(fd.split?String(v).split(fd.split):[String(v)]).map(function(x){return x.trim().toLowerCase();});
          for(var s of sel){ if(vals.indexOf(s)>=0) return true; } return false;
        });
      }
    });
    rows=search(rows,B.query,'_hay','name');
    if(B.sort) rows=sortRows(rows,B.sort);
    var total=rows.length;
    var pages=Math.max(1,Math.ceil(total/PAGE));
    if(B.page>=pages) B.page=0;
    var slice=rows.slice(B.page*PAGE,B.page*PAGE+PAGE);
    $('#ailCount').textContent = total.toLocaleString()+' '+(total===1?'result':'results');
    // active chips
    var chips=[];
    Object.keys(B.facets).forEach(function(f){ (B.facets[f]||new Set()).forEach(function(v){
      var d=(B.facetDisp&&B.facetDisp[f+''+v])||v;
      chips.push('<button class="ail-chip-active" data-f="'+esc(f)+'" data-v="'+esc(v)+'">'+esc(d)+' ✕</button>'); }); });
    if(B.query) chips.push('<span class="ail-chip-active" style="cursor:default">“'+esc(B.query)+'”</span>');
    $('#ailChips').innerHTML = chips.join('') + (chips.length?'<button class="ail-clear" id="ailClear">Clear all</button>':'');
    // results
    var rc=$('#ailResults');
    if(!slice.length){ rc.innerHTML='<div class="ail-empty" role="status">No resources match these filters.<br><button class="btn btn-primary btn-sm" id="ailReset">Clear filters</button></div>'; }
    else rc.innerHTML='<div class="ail-grid">'+slice.map(cardHTML).join('')+'</div>'+pagerHTML(B.page,pages);
    // perk badges (async)
    markPerks(slice);
  }

      if(links.length) html+='<div class="ail-links">'+links.join('')+'</div>';

      if(key==='skill'){ html+='<p style="margin:26px 0 0;font-size:13.5px;color:#8a93a3">Universal install: <code style="font-family:\'JetBrains Mono\',monospace">npx skills init</code> → <code style="font-family:\'JetBrains Mono\',monospace">npx skills add '+esc(e.github_url||r.external_url||'')+' --skill '+esc(r.name)+'</code> → pick your platform.</p>'; }
      html+='</div>';
      host.innerHTML=html;
      window.scrollTo({top:0});
      // copy
      var cb=host.querySelector('[data-copy]');
      if(cb) cb.addEventListener('click',function(){ var txt=cb.getAttribute('data-copy'); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){cb.textContent='Copied';setTimeout(function(){cb.textContent='Copy';},1500);}).catch(function(){}); });
      // perk cross-link
      renderXlink(r);
    });
  }
  function renderXlink(r){
    var box=$('#ailXlink'); if(!box) return;
    loadPerks().then(function(matches){
      var m=null; for(var i=0;i<matches.length;i++){ if(matches[i].resource_explainx_url===r.primary_url || (matches[i].resource_name===r.name && matches[i].resource_category===r.category)){ m=matches[i]; break; } }
      if(!m) return;
      var slug=perkSlug(m.perk_company);
      box.innerHTML='<div class="ail-xlink"><div class="ail-xlink-k">Save on this</div>'+
        '<div class="ail-xlink-h">'+esc(m.perk_company)+' has '+esc(m.perk_credits||'credits')+' available via LevelUp AI Perks.</div>'+
        '<a href="https://promptvault.vercel.app/#/perks" target="_blank" rel="noopener">See LevelUp AI Perks →</a>'+'</div>';
    });
  }
  function perkSlug(company){
    try{ if(typeof ALL_PERKS==='undefined') return null;
      var c=String(company||'').toLowerCase();
      for(var i=0;i<ALL_PERKS.length;i++){ if(String(ALL_PERKS[i].name||'').toLowerCase()===c || String(ALL_PERKS[i].company||'').toLowerCase()===c) return ALL_PERKS[i].slug; }
    }catch(_){}
    return null;
  }

  var ICON_SEARCH='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>';
  var ICON_BACK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
  var ICONS={
    skill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>',
    tool:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5 2.5-2.5Z"/></svg>',
    mcp_server:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9zM9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>',
    llm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a4 4 0 0 0-4 4 3.5 3.5 0 0 0-1 6.8V17a3 3 0 0 0 5 2 3 3 0 0 0 5-2v-3.2A3.5 3.5 0 0 0 16 7a4 4 0 0 0-4-4Z"/></svg>',
    agent:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/><circle cx="12" cy="3" r="1"/></svg>',
    design:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1"/><circle cx="12" cy="8" r="1"/><circle cx="15.5" cy="10" r="1"/><path d="M12 21a3 3 0 0 0 0-6 2 2 0 0 1 0-4"/></svg>'
  };

  // expose for the router
  window.renderResourcesHub = renderHub;
  window.renderResourcesBrowse = renderBrowse;
  window.renderResourceDetail = renderDetail;
})();
</script>
<script>
(function(){
  function route(){
    var h=location.hash||'';
    var pg = h.indexOf('#/r/')===0 ? 'page-resource' : 'page-aivault';
    document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
    var el=document.getElementById(pg); if(el) el.classList.add('active');
    if(pg==='page-resource'){ window.renderResourceDetail(decodeURIComponent(h.slice(4))); }
    else { var m=h.match(/^#\/c\/([^/?]+)/); if(m) window.renderResourcesBrowse(m[1]); else window.renderResourcesHub(); }
    if(pg!=='page-resource') window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',route);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',route); else route();
})();
</script>
