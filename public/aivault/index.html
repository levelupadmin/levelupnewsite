<style>
:root{
  --forge-blue:#1A6AFF;--brand-blue:#1A6AFF;
  --bg:#fbfbfd;--bg-nav:251,251,253;--surface:#fff;--surface-2:#f1f3f8;--surface-3:#eef2fb;--surface-4:#eef1f7;
  --text:#0c1322;--text-2:#3b4453;--muted:#5b6470;--muted-2:#8a93a3;--muted-3:#9aa3b2;--muted-4:#7a8497;
  --border:#e2e6ee;--border-2:#edf0f6;--border-3:#eceef3;--border-4:#e7eaf1;--border-hover:#cdd6e6;--border-strong:#bcc7da;--divider:#d8dde7;
  --accent-soft:rgba(26,106,255,.08);--accent-soft-2:rgba(26,106,255,.10);--accent-soft-3:rgba(26,106,255,.09);--accent-line:rgba(26,106,255,.22);--accent-glow:rgba(26,106,255,.10);
  --sh-card:rgba(20,30,55,.04);--sh-card2:rgba(20,30,55,.06);--sh-hover:rgba(20,30,55,.16);--sh-hover-sm:rgba(20,30,55,.09);--sh-hover-md:rgba(20,30,55,.18);
  --term-bg:#0c1322;--term-border:#1c2740;--term-tag:#5b6a86;--term-code:#cfe0ff;--term-prompt:#4f7fff;--term-k:#7fa8ff;--term-s:#8fe0b0;
  --green:#1a7f4b;--green-soft:rgba(26,160,90,.10);--green-line:rgba(26,160,90,.18);
  --star:#f5a623;
  --overlay:rgba(12,19,34,.34);--modal-sh1:rgba(12,19,34,.42);--modal-sh2:rgba(12,19,34,.12);
  --sk-1:#eef1f6;--sk-2:#f6f8fc;--grad-card:#fcfdff;--grad-tool:#f7f9ff;
  --save-soft:#f5f8ff;--save-on:#eef4ff;--save-line:#bcd0fb;
  --badge-purple:#7a5af0;--badge-purple-bg:rgba(122,90,240,.10);--badge-purple-line:rgba(122,90,240,.18);
  --badge-amber:#b1671a;--badge-amber-bg:rgba(200,120,30,.10);--badge-amber-line:rgba(200,120,30,.18);
  --press:rgba(12,19,34,.06);--video-bg:#000;
  --cmd-hair:#eef0f5;
}
[data-theme='dark']{
  --bg:#0b0e14;--bg-nav:13,16,22;--surface:#141925;--surface-2:#1b2230;--surface-3:#16243f;--surface-4:#1b2230;
  --text:#eef1f7;--text-2:#c4ccd9;--muted:#9aa3b2;--muted-2:#7e8798;--muted-3:#828ba0;--muted-4:#8b94a6;
  --border:#252c3a;--border-2:#222a38;--border-3:#1e2532;--border-4:#252c3a;--border-hover:#3a4456;--border-strong:#3a4456;--divider:#2a3240;
  --accent-soft:rgba(26,106,255,.16);--accent-soft-2:rgba(26,106,255,.20);--accent-soft-3:rgba(26,106,255,.18);--accent-line:rgba(26,106,255,.34);--accent-glow:rgba(26,106,255,.16);
  --sh-card:rgba(0,0,0,.30);--sh-card2:rgba(0,0,0,.36);--sh-hover:rgba(0,0,0,.55);--sh-hover-sm:rgba(0,0,0,.4);--sh-hover-md:rgba(0,0,0,.5);
  --term-bg:#070a10;--term-border:#1c2740;--term-tag:#6c7c98;
  --green:#3fcf8e;--green-soft:rgba(63,207,142,.12);--green-line:rgba(63,207,142,.22);
  --overlay:rgba(0,0,0,.55);--modal-sh1:rgba(0,0,0,.6);--modal-sh2:rgba(0,0,0,.4);
  --sk-1:#1a2130;--sk-2:#222b3c;--grad-card:#161c28;--grad-tool:#161c28;
  --save-soft:rgba(26,106,255,.12);--save-on:rgba(26,106,255,.18);--save-line:rgba(26,106,255,.45);
  --badge-purple:#a48bff;--badge-purple-bg:rgba(122,90,240,.18);--badge-purple-line:rgba(122,90,240,.30);
  --badge-amber:#d9a05a;--badge-amber-bg:rgba(200,120,30,.18);--badge-amber-line:rgba(200,120,30,.30);
  --press:rgba(255,255,255,.07);--video-bg:#000;
  --cmd-hair:#1e2532;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
html{background:var(--bg)}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.ailnav{max-width:100vw;min-width:0}
.ailnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 24px;background:rgba(var(--bg-nav),.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-3)}
.ailnav-brand{display:flex;align-items:center;gap:10px;font:700 16px 'DM Sans';text-decoration:none;color:var(--text)}
.ailnav-logo{width:84px;height:24px;display:inline-block;background:var(--forge-blue);-webkit-mask:url('/aivault/logo.svg') center/contain no-repeat;mask:url('/aivault/logo.svg') center/contain no-repeat}
.ailnav-sub{font:600 16px 'DM Sans';color:var(--text);border-left:1.5px solid var(--divider);padding-left:9px;margin-left:1px;white-space:nowrap}
.ailnav-links{display:flex;gap:20px;font-size:13.5px;font-weight:600;flex-wrap:wrap}
.ailnav-links a{text-decoration:none;color:var(--muted);white-space:nowrap;padding:8px 4px;display:inline-block}
.ailnav-links a:hover{color:var(--forge-blue)}
.ailfoot{border-top:1px solid var(--border-3);padding:30px 24px;text-align:center;color:var(--muted-2);font-size:13px;line-height:1.6}
.ailfoot a{color:var(--forge-blue);text-decoration:none}
.page{display:none}
.page.active{display:block}
@media(max-width:560px){.ailnav-links a[target="_blank"]{display:none}}
.ail-wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.ail-hero{position:relative;padding:88px 0 24px}
.ail-hero::before{content:'';position:absolute;left:-120px;top:-40px;width:520px;height:340px;background:radial-gradient(closest-side,var(--accent-soft-2),transparent);filter:blur(8px);z-index:-1;pointer-events:none}
.ail-stats{margin:18px 0 0;font:600 13px/1.6 'JetBrains Mono',monospace;color:var(--muted-2)}
.ail-back{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 'DM Sans',sans-serif;color:var(--muted);text-decoration:none;padding:10px 2px;margin-bottom:8px}
.ail-back:hover{color:var(--forge-blue,#1A6AFF)}
.ail-eyebrow{font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:var(--forge-blue,#1A6AFF)}
.ail-h1{font:700 clamp(32px,5vw,56px)/1.05 'DM Sans',sans-serif;margin:14px 0 0;letter-spacing:-.02em;color:var(--text)}
.ail-h1 em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--forge-blue,#1A6AFF)}
.ail-lede{max-width:64ch;margin:16px 0 0;font-size:17px;line-height:1.5;color:var(--muted)}
.ail-search{position:relative;margin:26px 0 0;max-width:680px}
.ail-search input{width:100%;height:54px;border:1.5px solid var(--border);border-radius:14px;padding:0 18px 0 48px;font-size:16px;background:var(--surface);color:var(--text);transition:border-color .15s,box-shadow .15s}
.ail-search input:focus{outline:none;border-color:var(--forge-blue,#1A6AFF);box-shadow:0 0 0 4px rgba(26,106,255,.12)}
.ail-search > svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--muted-3);pointer-events:none}
/* Hero search: bigger, centerpiece treatment on the hub */
.ail-hero .ail-search{margin:30px 0 0;max-width:720px}
.ail-hero .ail-search input{height:64px;font-size:18px;border-radius:16px;border-width:2px;padding:0 20px 0 54px;box-shadow:0 2px 14px var(--sh-card)}
.ail-hero .ail-search > svg{left:19px;width:22px;height:22px}
.ail-exq{display:flex;flex-wrap:wrap;gap:8px;max-width:720px;margin:14px 0 0}
.ail-exq-label{font:600 11px/1.9 'JetBrains Mono',monospace;letter-spacing:.6px;text-transform:uppercase;color:var(--muted-4);margin-right:2px}
.ail-exq-chip{font:600 13px/1 'DM Sans';color:var(--text);background:var(--surface-2);border:1.5px solid var(--border-2);border-radius:999px;padding:8px 13px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s,color .12s}
.ail-exq-chip:hover{transform:translateY(-1px);border-color:rgba(26,106,255,.42);background:var(--accent-soft-2);color:var(--forge-blue,#1A6AFF)}
.ail-exq-chip:focus-visible{outline:2px solid var(--forge-blue,#1A6AFF);outline-offset:2px}
@media(max-width:640px){.ail-hero .ail-search input{height:56px;font-size:16px}}
/* Intent-first goal tiles */
.ail-goals{margin:30px 0 8px}
.ail-goals-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 16px}
.ail-goals-title{font:600 20px 'Instrument Serif',Georgia,serif;letter-spacing:.2px;margin:0}
.ail-goals-title em{font-style:italic;color:var(--forge-blue)}
.ail-goals-sub{font:400 13.5px 'DM Sans';color:var(--muted);margin:0}
.ail-goals-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ail-goal{position:relative;display:flex;flex-direction:column;gap:9px;text-decoration:none;color:inherit;border:1.5px solid var(--border-2);border-radius:16px;padding:18px 18px 16px;background:var(--surface);box-shadow:0 1px 2px var(--sh-card);transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s,border-color .18s}
.ail-goal:hover{transform:translateY(-3px);box-shadow:0 20px 48px -12px var(--sh-hover);border-color:var(--accent-line)}
.ail-goal:focus-visible{outline:2px solid var(--forge-blue);outline-offset:2px}
.ail-goal-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;line-height:1;background:var(--accent-soft-3)}
.ail-goal-label{font:600 15.5px 'DM Sans';color:var(--text);letter-spacing:-.1px}
.ail-goal-hint{font:400 13px 'DM Sans';color:var(--muted);line-height:1.4}
.ail-goal-go{margin-top:auto;font:600 12.5px 'DM Sans';color:var(--forge-blue);opacity:0;transform:translateX(-4px);transition:opacity .18s,transform .18s}
.ail-goal:hover .ail-goal-go,.ail-goal:focus-visible .ail-goal-go{opacity:1;transform:none}
@media(max-width:900px){.ail-goals-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.ail-goals-grid{grid-template-columns:1fr}.ail-goals-head{flex-direction:column;align-items:flex-start;gap:2px}}
.ail-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:32px 0 80px}
.ail-tile{display:block;text-decoration:none;color:inherit;border:1.5px solid var(--border-2);border-radius:18px;padding:22px;background:var(--surface);box-shadow:0 1px 2px var(--sh-card);transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s,border-color .18s}
.ail-tile:hover{transform:translateY(-3px);box-shadow:0 20px 48px -10px var(--sh-hover);border-color:var(--border-hover)}
.ail-tile-ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft-3)}
.ail-tile-ico svg{width:24px;height:24px;color:var(--forge-blue)}
.ail-tile-name{font:700 21px/1.1 'DM Sans';margin:15px 0 0;color:var(--text)}
.ail-tile-count{font:600 13px/1 'JetBrains Mono',monospace;color:var(--forge-blue,#1A6AFF);margin:7px 0 0}
.ail-tile-blurb{font-size:14px;line-height:1.45;color:var(--muted);margin:10px 0 0}
.ail-gres{margin:18px 0 80px;max-width:680px}
.ail-gres-row{display:flex;gap:12px;align-items:center;padding:13px 16px;border:1.5px solid var(--border-2);border-radius:14px;margin-bottom:8px;text-decoration:none;color:inherit;background:var(--surface);box-shadow:0 1px 2px var(--sh-card);transition:transform .14s,box-shadow .14s,border-color .14s}
.ail-gres-row:hover{transform:translateY(-2px);box-shadow:0 12px 28px var(--sh-hover-sm);border-color:var(--border-hover);background:var(--surface)}
.ail-gres-badge{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:'Instrument Serif',serif;font-weight:400;font-size:17px;background:var(--surface-3);color:var(--forge-blue)}
.ail-gres-name{font:600 15px/1.2 'DM Sans';color:var(--text)}
.ail-gres-meta{font-size:12.5px;color:var(--muted-2);margin-top:2px}
.ail-gres-cat{margin-left:auto;flex:none;font:600 11px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.4px;color:var(--muted-4);background:var(--surface-2);border-radius:6px;padding:4px 8px}
.ail-layout{display:grid;grid-template-columns:230px 1fr;gap:34px;align-items:start;padding-bottom:90px}
.ail-layout--solo{grid-template-columns:1fr;max-width:1000px;margin:0 auto}
.ail-rail{position:sticky;top:84px}
.ail-filtoggle{display:none}
.ail-rail-grp{margin-bottom:22px}
.ail-rail-label{font:700 11px/1 'JetBrains Mono',monospace;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted-3);margin-bottom:10px}
.ail-facet{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 11px;font:500 13px/1 'DM Sans';color:var(--text-2);cursor:pointer;margin:0 6px 6px 0;transition:all .12s}
.ail-facet:hover{border-color:var(--border-strong)}
.ail-facet.is-on{background:var(--forge-blue,#1A6AFF);border-color:var(--forge-blue,#1A6AFF);color:var(--surface)}
.ail-facet .ct{font:600 10.5px/1 'JetBrains Mono',monospace;color:var(--muted-3);background:var(--surface-2);border-radius:5px;padding:1px 5px;margin-left:2px}
.ail-facet.is-on .ct{background:rgba(255,255,255,.22);color:var(--surface)}
.ail-main-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.ail-count{font:600 14px/1 'JetBrains Mono',monospace;color:var(--muted-2)}
.ail-chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 16px;min-height:0}
.ail-chip-active{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--forge-blue,#1A6AFF);border:1px solid var(--accent-line);border-radius:999px;padding:5px 10px;font:600 12.5px/1 'DM Sans';cursor:pointer}
.ail-chip-active:hover{background:rgba(26,106,255,.14)}
.ail-clear{background:none;border:none;color:var(--muted-2);font:600 12.5px/1 'DM Sans';cursor:pointer;padding:5px 4px;text-decoration:underline}
.ail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ail-card{min-width:0;position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;border:1.5px solid var(--border-2);border-radius:16px;padding:18px;background:var(--surface);box-shadow:0 1px 2px var(--sh-card),0 1px 3px var(--sh-card2);transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s,border-color .18s}
.ail-card:hover{transform:translateY(-3px);box-shadow:0 16px 40px -8px var(--sh-hover);border-color:var(--border-hover)}
.ail-card-top{display:flex;gap:12px;align-items:center;padding-right:30px}
/* ===== Save to My Stack + Recently viewed ===== */
.ail-save{appearance:none;-webkit-appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted-3);border-radius:9px;padding:6px;line-height:0;transition:color .15s,border-color .15s,background .15s,transform .12s}
.ail-save:hover{color:var(--forge-blue);border-color:var(--save-line);background:var(--save-soft)}
.ail-save:active{transform:scale(.92)}
.ail-save:focus-visible{outline:2px solid var(--forge-blue);outline-offset:2px}
.ail-save .ail-save-ic{fill:none;transition:fill .15s}
.ail-save.is-saved{color:var(--forge-blue);border-color:var(--save-line);background:var(--save-on)}
.ail-save.is-saved .ail-save-ic{fill:var(--forge-blue)}
/* card variant: floated top-right, not part of name flow */
.ail-card-top .ail-save{position:absolute;top:14px;right:14px}
/* detail variant: labelled pill */
.ail-save-lg{flex:none;align-self:flex-start;padding:9px 14px;border-radius:11px;font:700 13.5px/1 'DM Sans'}
.ail-save-lg .ail-save-txt{line-height:1}
.ail-recent{margin:30px 0 4px;text-align:left}
.ail-recent-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.ail-sec-h{font:700 14px/1 'DM Sans';text-transform:uppercase;letter-spacing:.6px;color:var(--muted-2);margin:0}
.ail-recent-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.ail-recent-row::-webkit-scrollbar{height:6px}
.ail-recent-row::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
.ail-recent-card{flex:none;display:flex;align-items:center;gap:9px;max-width:230px;text-decoration:none;border:1.5px solid var(--border-2);border-radius:12px;padding:9px 13px 9px 9px;background:var(--surface);transition:border-color .15s,transform .15s,box-shadow .15s}
.ail-recent-card:hover{border-color:var(--border-hover);transform:translateY(-2px);box-shadow:0 8px 22px -10px var(--sh-hover-md)}
.ail-recent-badge{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:'Instrument Serif',serif;font-size:17px}
.ail-recent-name{font:600 13.5px/1.25 'DM Sans';color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ail-card-badge{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:'Instrument Serif',serif;font-weight:400;font-size:21px;background:var(--surface-3);color:var(--forge-blue)}
.ail-card-name{font:700 16px/1.2 'DM Sans';color:var(--text);word-break:break-word}
.ail-card-meta{font-size:12.5px;color:var(--muted-2);margin-top:2px}
.ail-card-desc{font-size:13.5px;line-height:1.5;color:var(--muted);margin:12px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ail-card-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:13px}
.ail-chip{font:600 11px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.4px;color:var(--muted-4);background:var(--surface-2);border-radius:6px;padding:5px 8px}
.ail-perk{font:600 11.5px/1 'DM Sans';color:var(--green);background:var(--green-soft);border-radius:6px;padding:5px 8px}
.ail-card-tag{font:600 11px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--surface-4);border:1px solid var(--border);border-radius:6px;padding:5px 8px;cursor:pointer;transition:all .12s;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ail-card-tag:hover{background:var(--accent-soft-2);border-color:rgba(26,106,255,.32);color:var(--forge-blue)}
.ail-det-tag{display:inline-block;margin-top:10px;font:600 12px/1 'DM Sans';color:var(--forge-blue);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:999px;padding:6px 12px;text-decoration:none}
.ail-det-tag:hover{background:rgba(26,106,255,.15)}
/* setup-difficulty badge (derived, honest, subtle) */
.ail-badge{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.4px;border-radius:6px;padding:5px 7px;white-space:nowrap;border:1px solid transparent}
.ail-badge svg{width:11px;height:11px;flex:none}
.ail-badge--beginner{color:var(--green);background:var(--green-soft);border-color:var(--green-line)}
.ail-badge--quick{color:#1A6AFF;background:var(--accent-soft-3);border-color:rgba(26,106,255,.18)}
.ail-badge--nosetup{color:var(--badge-purple);background:var(--badge-purple-bg);border-color:var(--badge-purple-line)}
.ail-badge--model{color:var(--badge-amber);background:var(--badge-amber-bg);border-color:var(--badge-amber-line)}

@media (max-width:640px){ .ail-pairs-grid{grid-template-columns:1fr} }
@media (max-width:880px){
  /* Let the hero row wrap so the actions block drops to its own line instead of
     crushing the title column to width:0 (title-per-character + off-screen Save). */

  .ail-dx-hd{flex:1 1 60%;min-width:0}
  .ail-dx-actions{margin-left:0;flex:1 1 100%;width:100%;margin-top:14px}
  .ail-dx-actions .ail-aicopy{flex:1;justify-content:center}
  .ail-dx-top .ail-dx-actions .ail-dx-save{position:static}
  .ail-dx-hero{padding:20px 18px}
  .ail-dx-badge{width:54px;height:54px;font-size:26px;border-radius:15px}

}

  .ail-filtoggle .ct{margin-left:auto;color:var(--muted-3);font-weight:600}
  .ail-filtoggle svg{width:18px;height:18px;flex:none;color:var(--muted-3)}
  .ail-tiles{grid-template-columns:1fr}
  .ail-grid{grid-template-columns:minmax(0,1fr)}
  .ail-hero{padding:84px 0 18px}
  .ail-facet{padding:11px 14px;font-size:14px;min-height:44px;margin:0 8px 8px 0}
  .ail-install{flex-direction:column;align-items:stretch;gap:10px}
  .ail-install code{width:100%}
  .ail-install button{width:100%;padding:13px;font-size:14px}
  .ail-card-name{font-size:17px}
  .ail-card-desc{font-size:14.5px}

  .ail-chip{font-size:11.5px;padding:5px 9px}
  .ailfoot{font-size:13px;line-height:1.7}
  .ail-pager button{min-width:44px;height:44px}
  /* Bump hero example-chips to the 44px touch-target minimum */
  .ail-exq-chip{min-height:44px;padding:11px 14px}
}
@media (hover:none){ .ail-card-cta{opacity:1} }
/* collections */

/* popularity */

.ail-card-ww{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 'JetBrains Mono',monospace;color:#1A6AFF;background:var(--accent-soft);border-radius:6px;padding:3px 7px}

/* ===== ⌘K command palette ===== */
.ailnav-k{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:7px 9px 7px 11px;font:600 13px/1 'DM Sans';color:var(--muted);cursor:pointer;transition:border-color .14s,color .14s,box-shadow .14s;white-space:nowrap}
.ailnav-k:hover{border-color:var(--forge-blue,#1A6AFF);color:var(--forge-blue,#1A6AFF);box-shadow:0 0 0 3px var(--accent-soft)}
.ailnav-k svg{color:var(--muted-3);flex:none}

.ailnav-theme{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--border);background:var(--surface);border-radius:10px;color:var(--muted-3);cursor:pointer;flex:none;padding:0;transition:border-color .14s,color .14s,box-shadow .14s}
.ailnav-theme:hover{border-color:var(--forge-blue,#1A6AFF);color:var(--forge-blue,#1A6AFF);box-shadow:0 0 0 3px var(--accent-soft)}
.ailnav-theme .ail-ico-moon{display:none}
.ailnav-theme .ail-ico-sun{display:block}
[data-theme='dark'] .ailnav-theme .ail-ico-moon{display:block}
[data-theme='dark'] .ailnav-theme .ail-ico-sun{display:none}
.ailnav-k .ailnav-k-txt{flex:1}
.ailnav-k kbd{display:inline-flex;align-items:center;gap:1px;font:600 11px/1 'JetBrains Mono',monospace;color:var(--muted-4);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:3px 6px}
.ailcmd-back{position:fixed;inset:0;z-index:200;background:var(--overlay);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .16s;display:flex;align-items:flex-start;justify-content:center;padding:14vh 16px 16px}
.ailcmd-back.is-open{opacity:1;pointer-events:auto}
.ailcmd{width:100%;max-width:620px;background:var(--surface);border:1px solid var(--border-4);border-radius:18px;box-shadow:0 28px 80px -16px var(--modal-sh1),0 4px 14px var(--modal-sh2);overflow:hidden;transform:translateY(-8px) scale(.985);opacity:0;transition:transform .18s cubic-bezier(.2,.7,.3,1),opacity .18s}
.ailcmd-back.is-open .ailcmd{transform:none;opacity:1}
.ailcmd-top{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--cmd-hair)}
.ailcmd-top svg{color:var(--muted-3);flex:none}
.ailcmd-input{flex:1;border:0;outline:0;background:transparent;font:500 17px/1.3 'DM Sans';color:var(--text)}
.ailcmd-input::placeholder{color:var(--muted-3)}
.ailcmd-esc{flex:none;font:600 11px/1 'JetBrains Mono',monospace;color:var(--muted-4);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:4px 7px}
.ailcmd-list{max-height:54vh;overflow-y:auto;overscroll-behavior:contain;padding:6px}
.ailcmd-grp{font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-3);padding:13px 12px 7px}
.ailcmd-row{display:flex;gap:11px;align-items:center;padding:9px 11px;border-radius:11px;cursor:pointer;text-decoration:none;color:inherit;scroll-margin:8px}
.ailcmd-row[aria-selected="true"]{background:var(--accent-soft-3)}
.ailcmd-badge{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:'Instrument Serif',serif;font-weight:400;font-size:17px}
.ailcmd-body{min-width:0;flex:1;display:flex;flex-direction:column}
.ailcmd-name{font:600 14.5px/1.25 'DM Sans';color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ailcmd-name b{color:var(--forge-blue,#1A6AFF);font-weight:700}
.ailcmd-desc{font-size:12.5px;line-height:1.3;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ailcmd-cat{flex:none;font:600 10.5px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.4px;color:var(--muted-4);background:var(--surface-2);border-radius:6px;padding:4px 7px}
.ailcmd-row[aria-selected="true"] .ailcmd-go{opacity:1}
.ailcmd-go{flex:none;font:600 11px/1 'JetBrains Mono',monospace;color:var(--forge-blue,#1A6AFF);opacity:0;transition:opacity .12s;margin-left:2px}
.ailcmd-state{padding:34px 20px;text-align:center;color:var(--muted-3);font:600 13.5px/1.5 'DM Sans'}
.ailcmd-foot{display:flex;align-items:center;gap:16px;padding:9px 16px;border-top:1px solid var(--cmd-hair);font:500 11.5px/1 'DM Sans';color:var(--muted-3);flex-wrap:wrap}
.ailcmd-foot kbd{font:600 10.5px/1 'JetBrains Mono',monospace;color:var(--muted-4);background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:3px 5px;margin:0 1px}
@media (max-width:560px){
  .ailnav-k .ailnav-k-txt,.ailnav-k kbd{display:none}
  .ailnav-k{min-width:44px;min-height:44px;padding:0;border-radius:10px;justify-content:center}
  .ailnav{padding:8px 16px;gap:10px}
  .ailnav-links{gap:10px;flex-wrap:nowrap;font-size:12.5px;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent)}
  .ailnav-links::-webkit-scrollbar{display:none}
  .ailnav-links a{padding:11px 2px}
  .ailcmd-back{padding:8vh 10px 10px;align-items:flex-start}
  .ailcmd-foot{display:none}
  .ailcmd-list{max-height:64vh}
  .ailcmd-desc{display:none}
  .ailcmd-go{display:none}
  .ailcmd-row{gap:9px;padding:9px 9px}
  .ail-save{min-width:44px;min-height:44px;justify-content:center}
  .ail-card-top .ail-save{top:9px;right:9px}
  .ail-save-lg{min-height:44px}
  .ail-back{min-height:44px;padding:13px 2px;align-items:center}
  .ail-sort{min-height:44px;padding-top:0;padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){
  .ailcmd-back,.ailcmd{transition:opacity .12s}
  .ailcmd{transform:none}
}

/* ===== "New here?" onboarding banner (hub) ===== */

.ail-onb-x{position:absolute;top:12px;right:12px;width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--muted-3);cursor:pointer;display:grid;place-items:center;transition:background .14s,color .14s}

@media(max-width:560px){.ail-onb{flex-direction:column;gap:12px;padding:16px 16px 16px}.ail-onb-x{width:40px;height:40px;top:6px;right:6px}.ail-onb-acts a{min-height:44px}}
/* ===== Learning Guide (#/guide) ===== */

.ail-step{position:relative;display:flex;gap:18px;align-items:flex-start;margin:22px 0 0;border:1.5px solid var(--border-2);border-radius:18px;padding:22px;background:var(--surface);box-shadow:0 1px 2px var(--sh-card)}
.ail-step-n{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font:700 18px/1 'Instrument Serif',serif;background:var(--accent-soft-2);color:var(--forge-blue,#1A6AFF)}
.ail-step-body{min-width:0;flex:1}
.ail-step-h{font:700 19px/1.2 'DM Sans';color:var(--text);margin:0}

.ail-step-links a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:600 12.5px/1 'DM Sans';color:var(--forge-blue,#1A6AFF);background:var(--accent-soft);border:1px solid rgba(26,106,255,.18);border-radius:999px;padding:7px 13px;transition:background .12s}

/* ===== LLM compare mode ===== */

.ail-cmp-toggle svg{width:14px;height:14px;flex:none;color:var(--muted-3)}
.ail-cmp-toggle:hover{border-color:var(--border-strong)}
.ail-cmp-toggle.is-on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--forge-blue)}

.ail-main.is-cmp .ail-card{padding-left:46px}

.ail-cmpbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(140%);z-index:120;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);padding:11px 12px 11px 18px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 18px 50px -12px var(--sh-hover),0 4px 14px var(--sh-card2);transition:transform .26s cubic-bezier(.2,.7,.3,1)}

.ail-cmpbar-chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 'DM Sans';color:var(--text-2);background:var(--surface-2);border-radius:999px;padding:5px 6px 5px 10px;max-width:170px}

.ail-cmpbar-chip button{border:0;background:none;color:var(--muted-3);cursor:pointer;padding:0;line-height:0;display:inline-flex}

.ail-cmpbar-go{flex:none;display:inline-flex;align-items:center;gap:7px;font:700 13.5px/1 'DM Sans';color:#fff;background:var(--forge-blue);border:0;border-radius:11px;padding:11px 16px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s,box-shadow .14s,background .14s}

.ail-cmpbar-clear{flex:none;border:0;background:none;color:var(--muted-2);font:600 12px/1 'DM Sans';cursor:pointer;text-decoration:underline;padding:6px}

  // (2) related-resource discovery — same category, shared primary tag, by stars
  function relScore(r){ var s=starN(r); return s<0?0:s; }
  // A per-repo key so one mega-repo's many bundled skills can't dominate "like this".
  function relRepoKey(r){ var e=r.extra||{}; var k=(e.owner||'')+'/'+(e.repo||''); return k==='/' ? '' : k.toLowerCase(); }
  function getRelated(item, rows){
    var out = { primary:[] };
    if(!item || !rows || !rows.length) return out;
    var tag = cardTagInfo(item);            // {f,v} primary facet, or null
    var self = item.slug;
    if(tag){
      var f=tag.f, want=String(tag.v).toLowerCase(), matches=[];
      for(var i=0;i<rows.length;i++){
        var r=rows[i]; if(r.slug===self) continue;
        var raw=(r.extra||{})[f]; if(raw==null) continue;
        var vals = (f==='categories')
          ? String(raw).split(/[;,]/).map(function(s){return s.trim().toLowerCase();})
          : [String(raw).toLowerCase()];
        if(vals.indexOf(want)>=0) matches.push(r);
      }
      matches.sort(function(a,b){ return relScore(b)-relScore(a); });
      // De-dupe by owner/repo first: skills bundled in one mega-repo all inherit that
      // repo's full star count, so a plain star sort would surface "whatever lives in the
      // biggest repo". Take at most one skill per repo, then backfill from the rest if we
      // still have fewer than 4 (e.g. small categories where everything is one repo).
      var seen={}, uniq=[], rest=[];
      for(var j=0;j<matches.length;j++){
        var m=matches[j], rk=relRepoKey(m);
        if(rk && seen[rk]){ rest.push(m); continue; }
        if(rk) seen[rk]=1;
        uniq.push(m);
      }
      out.primary = uniq.concat(rest).slice(0,4);
    }
    return out;
  }
  // complementary MCP-server categories derivable from a skill/tool's tag

    'data':['databases','analytics-data'],'data science':['databases','analytics-data'],'analytics':['analytics-data'],
    'research':['search-web'],'search':['search-web'],'writing':['content'],'content':['content'],
    'marketing':['analytics-data','content'],'productivity':['productivity'],'automation':['productivity','developer-tools'],
    'finance':['finance','accounting'],'security':['auth-security'],'design':['content'],
    'web':['browser-automation','search-web'],'websites':['browser-automation'],'chatbots':['ai-ml']
  };

  // =========================================================
  // KEYBOARD NAV for browse/search result cards
  //   '/'  focus search   ↑/↓ move highlight   Enter open   Esc clear
  // =========================================================
  var aivaultKbdNav = (function(){
    var idx = -1;

    function grid(){ return $('#ailResults .ail-grid'); }
    function cards(){
      var g = grid();
      return g ? Array.prototype.slice.call(g.querySelectorAll('.ail-card')) : [];
    }
    function paletteOpen(){
      var b=document.querySelector('.ailcmd-back');
      return !!(b && b.classList.contains('is-open'));
    }
    function onBrowse(){ return !!grid(); }

    function paint(){
      var els = cards();
      els.forEach(function(el,i){
        var on = (i===idx);
        el.classList.toggle('is-kbd', on);
        if(on){ el.setAttribute('aria-selected','true'); }
        else  { el.removeAttribute('aria-selected'); }
      });
      var cur = (idx>=0 && idx<els.length) ? els[idx] : null;
      if(cur) cur.scrollIntoView({block:'nearest'});
    }

    function move(d){
      var els = cards();
      if(!els.length){ idx=-1; return; }
      if(idx<0){ idx = (d>0 ? 0 : els.length-1); }
      else      { idx = (idx + d + els.length) % els.length; }
      paint();
    }

    function open(){
      var els = cards();
      if(idx>=0 && idx<els.length){ location.hash = '#/r/' + els[idx].getAttribute('data-slug'); }
    }

    function clear(){
      idx = -1;
      cards().forEach(function(el){ el.classList.remove('is-kbd'); el.removeAttribute('aria-selected'); });
    }

    function reset(){ idx = -1; }

    function focusSearch(){
      var q = $('#ailQ');
      if(q){ q.focus(); q.select && q.select(); return true; }
      return false;
    }

    document.addEventListener('keydown', function(e){
      if(!onBrowse() || paletteOpen()) return;

      var t = e.target, tag = t && t.tagName;
      var inField = (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable));
      var inOurSearch = (t && t.id==='ailQ');

      if(e.key==='/' && !inField){ e.preventDefault(); focusSearch(); return; }

      if(e.key==='ArrowDown'){
        if(inField && !inOurSearch) return;
        e.preventDefault(); move(1); return;
      }
      if(e.key==='ArrowUp'){
        if(inField && !inOurSearch) return;
        e.preventDefault(); move(-1); return;
      }

      if(e.key==='Enter' && idx>=0){
        if(inField && !inOurSearch) return;
        e.preventDefault(); open(); return;
      }

      if(e.key==='Escape'){ clear(); return; }
    });

    return { reset:reset, clear:clear };
  })();

  // =========================================================
  // ⌘K COMMAND PALETTE  (global fuzzy search over index.json)
  // =========================================================
  (function cmdk(){
    var back, input, list, hits=[], sel=-1, lastQ='', token=0;
    function hl(name, q){
      var safe=esc(name||'');
      if(!q) return safe;
      var i=safe.toLowerCase().indexOf(q.toLowerCase());
      if(i<0) return safe;
      return safe.slice(0,i)+'<b>'+safe.slice(i,i+q.length)+'</b>'+safe.slice(i+q.length);
    }
    function ensure(){
      if(back) return;
      back=document.createElement('div');
      back.className='ailcmd-back';
      back.setAttribute('role','dialog');
      back.setAttribute('aria-modal','true');
      back.setAttribute('aria-label','Search the AI Library');
      back.innerHTML=
        '<div class="ailcmd" role="combobox" aria-expanded="true" aria-haspopup="listbox" aria-owns="ailCmdList">'+
          '<div class="ailcmd-top">'+ICON_SEARCH+
            '<input class="ailcmd-input" id="ailCmdInput" type="text" autocomplete="off" spellcheck="false" '+
              'placeholder="Search 14,465 resources…" aria-label="Search all resources" '+
              'aria-controls="ailCmdList" aria-autocomplete="list">'+
            '<span class="ailcmd-esc">ESC</span>'+
          '</div>'+
          '<div class="ailcmd-list" id="ailCmdList" role="listbox" aria-label="Results">'+
            '<div class="ailcmd-state">Type to search skills, tools, MCP servers, LLMs, agents &amp; designs.</div>'+
          '</div>'+
          '<div class="ailcmd-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>'+
        '</div>';
      document.body.appendChild(back);
      input=$('#ailCmdInput',back); list=$('#ailCmdList',back);
      back.addEventListener('mousedown',function(e){ if(e.target===back) close(); });
      input.addEventListener('input',onInput);
      input.addEventListener('keydown',onKey);
      list.addEventListener('mousemove',function(e){ var row=e.target.closest&&e.target.closest('[data-i]'); if(row){ var i=+row.getAttribute('data-i'); if(i!==sel){ sel=i; paintSel(); } } });
      list.addEventListener('click',function(e){ var row=e.target.closest&&e.target.closest('[data-i]'); if(row){ e.preventDefault(); go(+row.getAttribute('data-i')); } });
    }
    function open(){
      ensure();
      back.classList.add('is-open');
      document.documentElement.style.overflow='hidden';
      input.value=''; lastQ=''; hits=[]; sel=-1;
      list.innerHTML='<div class="ailcmd-state">Type to search skills, tools, MCP servers, LLMs, agents &amp; designs.</div>';
      loadIndex();
      requestAnimationFrame(function(){ input.focus(); });
    }
    function close(){
      if(!back) return;
      back.classList.remove('is-open');
      document.documentElement.style.overflow='';
    }
    function isOpen(){ return back && back.classList.contains('is-open'); }
    var onInput=debounce(function(){
      var q=input.value.trim();
      if(q===lastQ) return; lastQ=q;
      if(q.length<2){ hits=[]; sel=-1; list.innerHTML='<div class="ailcmd-state">Type to search skills, tools, MCP servers, LLMs, agents &amp; designs.</div>'; return; }
      var my=++token;
      loadIndex().then(function(idx){
        if(my!==token || !isOpen()) return;
        hits=search(idx,q,'_hay','n').slice(0,30);
        sel=hits.length?0:-1;
        paint(q);
      });
    },120);
    function paint(q){
      if(!hits.length){ list.innerHTML='<div class="ailcmd-state">No matches for “'+esc(q)+'”.</div>'; return; }
      list.innerHTML='<div class="ailcmd-grp">'+hits.length+' result'+(hits.length===1?'':'s')+'</div>'+
        hits.map(function(r,i){ var cc=CAT_BY[r.c]||{label:r.c}, mc=mono(r.n);
          return '<a class="ailcmd-row" role="option" data-i="'+i+'" id="ailCmdRow'+i+'" href="#/r/'+esc(r.s)+'" aria-selected="'+(i===sel?'true':'false')+'">'+
            '<span class="ailcmd-badge" style="background:'+mc.bg+';color:'+mc.fg+'">'+esc((r.n||'?').charAt(0).toUpperCase())+'</span>'+
            '<span class="ailcmd-body"><span class="ailcmd-name">'+hl(r.n,q)+'</span>'+
              (r.d?'<span class="ailcmd-desc">'+esc(r.d)+'</span>':'')+'</span>'+
            '<span class="ailcmd-cat">'+esc(cc.label)+'</span>'+
            '<span class="ailcmd-go">↵</span></a>';
        }).join('');
      paintSel();
    }
    function paintSel(){
      var rows=$$('.ailcmd-row',list);
      rows.forEach(function(el,i){ el.setAttribute('aria-selected', i===sel?'true':'false'); });
      var cur=rows[sel];
      if(cur){ input.setAttribute('aria-activedescendant',cur.id); cur.scrollIntoView({block:'nearest'}); }
      else input.removeAttribute('aria-activedescendant');
    }
    function move(d){
      if(!hits.length) return;
      sel=(sel+d+hits.length)%hits.length;
      paintSel();
    }
    function go(i){
      var r=hits[i]; if(!r) return;
      close();
      location.hash='#/r/'+r.s;
    }
    function onKey(e){
      if(e.key==='ArrowDown'){ e.preventDefault(); move(1); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); move(-1); }
      else if(e.key==='Enter'){ if(sel>=0){ e.preventDefault(); go(sel); } }
      else if(e.key==='Escape'){ e.preventDefault(); close(); }
      else if(e.key==='Tab'){ e.preventDefault(); move(e.shiftKey?-1:1); }
    }
    document.addEventListener('keydown',function(e){
      if((e.metaKey||e.ctrlKey) && (e.key==='k'||e.key==='K')){
        e.preventDefault(); isOpen()?close():open(); return;
      }
    });
    document.addEventListener('click',function(e){
      var b=e.target.closest&&e.target.closest('#ailCmdOpen');
      if(b){ e.preventDefault(); open(); }
    });
    window.openAivaultPalette=open;
  })();

  // =========================================================
  // "NEW HERE?" ONBOARDING BANNER  (hub, dismissible)
  // =========================================================
  var ONB_KEY='ail-onb-dismissed';
  function onbDismissed(){ try{ return localStorage.getItem(ONB_KEY)==='1'; }catch(e){ return false; } }
  function onbBannerHTML(){
    if(onbDismissed()) return '';
    return '<div class="ail-onb" id="ailOnb" role="note">'+
      '<div class="ail-onb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 7v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V7z"/><path d="m9 12 2 2 4-4"/></svg></div>'+
      '<div class="ail-onb-body">'+
        '<h2 class="ail-onb-h">New here? Start with the basics.</h2>'+
        '<p class="ail-onb-p">14,465 free AI resources — agent skills, tools, MCP servers, LLMs and more. Not sure where to begin? The 5-minute Start Guide walks you through your first skill.</p>'+
        '<div class="ail-onb-acts">'+
          '<a class="is-primary" href="#/guide">Start guide →</a>'+

      '<button class="ail-onb-x" id="ailOnbX" type="button" aria-label="Dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>'+
    '</div>';
  }
  document.addEventListener('click',function(e){
    var x=e.target.closest&&e.target.closest('#ailOnbX'); if(!x) return;
    try{ localStorage.setItem(ONB_KEY,'1'); }catch(_){}
    var b=$('#ailOnb'); if(b) b.parentNode.removeChild(b);
  });

  // =========================================================
  // LEARNING GUIDE  (#/guide)
  // =========================================================
  function renderGuide(){
    var host=$('#aivaultHost'); if(!host) return;
    var steps=[
      {h:'Pick what you want to do',p:'Browsing by goal beats browsing by name. Skills make your AI coding agent better at a task; tools are standalone apps; MCP servers connect agents to your data; LLMs are the models themselves.',
        links:[['#/c/skill','Agent skills'],['#/c/tool','AI tools'],['#/c/mcp_server','MCP servers']]},
      {h:'Tell us what you work in',p:'On the Skills page, pick your tool (Claude Code, Cursor, Cline, Windsurf…) once and we filter the catalog to skills verified to work with it. We remember it on this device.',
        links:[['#/c/skill','Set my tool →']]},
      {h:'Install your first skill',p:'Every skill ships a one-line install. Open any skill and copy the <code>npx skills add …</code> command, or use the universal installer: <code>npx skills init</code> then add the repo. No signup, nothing locked.',
        links:[['#/c/skill','Find a skill']]},
      {h:'Save a stack & keep going',p:'Tap the bookmark on any card to save it to <b>My Stack</b> — your personal shortlist, stored on this device. Press <kbd>⌘K</kbd> anytime to jump-search all 14,465 resources.',
        links:[['#/stack','My Stack'],['#/','All resources']]}
    ];
    var paths=[
      {ico:'⚡',name:'Make my AI coding agent smarter',blurb:'Install agent skills for Claude Code, Cursor & more.',href:'#/c/skill'},
      {ico:'🔌',name:'Connect my agent to my data',blurb:'MCP servers for databases, APIs & SaaS tools.',href:'#/c/mcp_server'},
      {ico:'🛠️',name:'Find an AI tool for a task',blurb:'3,537 AI tools — many with a student credit perk.',href:'#/c/tool'},
      {ico:'🧠',name:'Compare LLMs',blurb:'585 models by provider, size, context & weights.',href:'#/c/llm'}
    ];
    host.innerHTML=
      '<div class="ail-guide">'+
        '<a class="ail-back" href="#/">'+ICON_BACK+' AI Library</a>'+
        '<div class="ail-eyebrow">Start here · 5 minutes</div>'+
        '<h1 class="ail-h1">How to use the <em>AI Library</em>.</h1>'+
        '<p class="ail-guide-lede">14,465 free resources can be a lot. This quick guide gets you from zero to your first installed skill — and shows you how to find anything fast.</p>'+
        steps.map(function(s,i){
          return '<div class="ail-step">'+
            '<div class="ail-step-n">'+(i+1)+'</div>'+
            '<div class="ail-step-body"><h2 class="ail-step-h">'+esc(s.h)+'</h2>'+
              '<p class="ail-step-p">'+s.p+'</p>'+
              (s.links&&s.links.length?'<div class="ail-step-links">'+s.links.map(function(l){return '<a href="'+esc(l[0])+'">'+esc(l[1])+'</a>';}).join('')+'</div>':'')+
            '</div></div>';
        }).join('')+
        '<h2 class="ail-sec-t" style="margin:38px 0 4px">Or jump to your goal</h2>'+
        '<div class="ail-guide-paths">'+paths.map(function(p){
          return '<a class="ail-path" href="'+esc(p.href)+'">'+
            '<div class="ail-path-ico">'+esc(p.ico)+'</div>'+
            '<div class="ail-path-name">'+esc(p.name)+'</div>'+
            '<div class="ail-path-blurb">'+esc(p.blurb)+'</div>'+
            '<div class="ail-path-go">Open →</div></a>';
        }).join('')+'</div>'+
        '<div class="ail-guide-cta">'+
          '<a class="is-primary" href="#/c/skill">Browse all skills →</a>'+
          '<a class="is-ghost" href="#/">Back to the library</a>'+
        '</div>'+
      '</div>';
    window.scrollTo(0,0);
  }

  // =========================================================
  // COMPARE (LLMs)
  // =========================================================
  function cmpNameFor(slug){
    if(CMP_NAMES[slug]) return CMP_NAMES[slug];
    return slug.split('/').pop().replace(/-/g,' ');
  }
  function applyCmpFull(){
    var full=CMP.size>=CMP_MAX;
    $$('.ail-card[data-slug]').forEach(function(c){
      var sl=c.getAttribute('data-slug');
      c.classList.toggle('is-cmpfull', full && !CMP.has(sl));
    });
  }
  function flashCmpBar(){ var bar=$('#ailCmpBar'); if(!bar) return; bar.style.transition='transform .08s'; bar.style.transform='translateX(-50%) translateY(-4px)'; setTimeout(function(){ bar.style.transition=''; bar.style.transform=''; renderCmpBar(); },120); }
  function ensureCmpBar(){
    var bar=document.getElementById('ailCmpBar');
    if(!bar){ bar=document.createElement('div'); bar.className='ail-cmpbar'; bar.id='ailCmpBar'; document.body.appendChild(bar);
      bar.addEventListener('click',function(e){
        var rm=e.target.closest&&e.target.closest('[data-cmp-rm]');
        if(rm){ var sl=rm.getAttribute('data-cmp-rm'); CMP.delete(sl); var card=document.querySelector('.ail-card[data-slug="'+CSS.escape(sl)+'"]'); if(card) card.classList.remove('is-picked'); renderCmpBar(); applyCmpFull(); return; }
        if(e.target.closest&&e.target.closest('#ailCmpClear')){ CMP.clear(); $$('.ail-card.is-picked').forEach(function(c){c.classList.remove('is-picked');}); renderCmpBar(); applyCmpFull(); return; }
      });
    }
    return bar;
  }
  function renderCmpBar(){
    var bar=ensureCmpBar();
    var slugs=Array.from(CMP);
    if(!slugs.length){ bar.classList.remove('is-show'); bar.innerHTML=''; return; }
    var chips=slugs.map(function(s){ return '<span class="ail-cmpbar-chip"><span>'+esc(cmpNameFor(s))+'</span><button type="button" data-cmp-rm="'+esc(s)+'" aria-label="Remove">✕</button></span>'; }).join('');
    var canGo=slugs.length>=2;
    bar.innerHTML='<span class="ail-cmpbar-lbl"><b>'+slugs.length+'</b>/'+CMP_MAX+' selected</span>'+
      '<div class="ail-cmpbar-chips">'+chips+'</div>'+
      '<button class="ail-cmpbar-clear" id="ailCmpClear" type="button">Clear</button>'+
      '<a class="ail-cmpbar-go" href="#/compare?slugs='+encodeURIComponent(slugs.join(','))+'"'+(canGo?'':' aria-disabled="true" onclick="return false" style="opacity:.5;pointer-events:none"')+'>Compare →</a>';
    bar.classList.add('is-show');
  }
  function hideCmpBar(){ var bar=document.getElementById('ailCmpBar'); if(bar){ bar.classList.remove('is-show'); } }

  function renderCompare(qs){
    hideCmpBar();
    var host=$('#aivaultHost'); if(!host) return;
    var slugs=[];
    var _dec=function(s){ try{ return decodeURIComponent(s); }catch(_){ return s; } };
    (qs||'').split('&').forEach(function(p){ var i=p.indexOf('='); if(i<0) return; var k=p.slice(0,i), v=p.slice(i+1); if(k==='slugs'&&v){ slugs=_dec(v).split(',').map(function(s){return s.trim();}).filter(Boolean); } });
    slugs=slugs.filter(function(s){return s.indexOf('llm/')===0;}).slice(0,CMP_MAX);
    host.innerHTML='<div class="ail-cmp"><a class="ail-back" href="#/c/llm">'+ICON_BACK+' LLMs</a>'+
      '<h1 class="ail-h1" style="margin-top:6px">Compare <em>models</em></h1>'+
      '<div id="ailCmpBody" style="margin-top:22px"><div class="ail-load">Loading…</div></div></div>';
    window.scrollTo(0,0);
    if(!slugs.length){ $('#ailCmpBody').innerHTML='<div class="ail-empty">No models selected. <a href="#/c/llm">Browse LLMs</a>, tap <b>Compare</b>, then pick 2–4 models.</div>'; return; }
    loadCat('llm').then(function(rows){
      var byslug={}; rows.forEach(function(r){byslug[r.slug]=r;});
      var picks=slugs.map(function(s){return byslug[s];}).filter(Boolean);
      // sync CMP set to URL so returning to browse keeps selection
      CMP=new Set(picks.map(function(p){return p.slug;}));
      if(!picks.length){ $('#ailCmpBody').innerHTML='<div class="ail-empty">Those models could not be found. <a href="#/c/llm">Browse LLMs</a>.</div>'; return; }
      var rowsDef=[
        {k:'Type', get:function(e){ return e.kind?prettyLabel(e.kind):''; }},
        {k:'Provider', get:function(e){ return e.provider||''; }},
        {k:'Parameters', get:function(e){ return e.parameters||''; }},
        {k:'Context', get:function(e){ return e.context_length||''; }},
        {k:'Weights', get:function(e){ var w=String(e.weights||'').toLowerCase(); if(w==='open') return '<span class="ail-cmp-pill open">Open weights</span>'; if(w==='closed') return '<span class="ail-cmp-pill closed">Closed / API</span>'; return ''; }, raw:true},
        {k:'Summary', get:function(e,r){ return esc(String(r.description||'').split('|')[0]); }, raw:true, cls:'desc'}
      ];
      var enc=encodeURIComponent;
      var head='<tr><th class="ail-cmp-rowkey" scope="col"><span style="opacity:0">Model</span></th>'+picks.map(function(r){
        var m=mono(r.name);
        return '<th scope="col"><div class="ail-cmp-h"><div class="ail-cmp-h-top">'+
          '<span class="ail-cmp-h-badge" style="background:'+m.bg+';color:'+m.fg+'">'+esc((r.name||'?').charAt(0).toUpperCase())+'</span>'+
          '<a class="ail-cmp-h-name" href="#/r/'+esc(r.slug)+'" style="text-decoration:none;color:inherit">'+esc(r.name)+'</a></div>'+
          '<button class="ail-cmp-h-rm" type="button" data-rm="'+esc(r.slug)+'">Remove</button></div></th>';
      }).join('')+'</tr>';
      var body=rowsDef.map(function(rd){
        var vals=picks.map(function(r){ return rd.get(r.extra||{}, r); });
        var anyVal=vals.some(function(v){return !!v;});
        // skip an entirely-empty row (e.g. nobody has parameters), but always keep Summary
        if(!anyVal && rd.k!=='Summary') return '';
        var cells=vals.map(function(v){
          var cls='ail-cmp-val'+(v?'':' muted');
          return '<td><div class="'+cls+'">'+(v? (rd.raw?v:esc(v)) :'—')+'</div></td>';
        }).join('');
        return '<tr><th class="ail-cmp-rowkey" scope="row">'+esc(rd.k)+'</th>'+cells+'</tr>';
      }).join('');
      // links row
      var linkCells=picks.map(function(r){
        var e=r.extra||{};
        var url=e.website||((r.external_url&&!/explainx/.test(r.external_url))?r.external_url:'');
        var btns='<a class="ail-cmp-link" href="#/r/'+esc(r.slug)+'">Details</a>';
        if(url&&/^https?:/.test(url)) btns+=' <a class="ail-cmp-link" href="'+esc(url)+'" target="_blank" rel="noopener">Website ↗</a>';
        return '<td><div style="display:flex;flex-wrap:wrap;gap:8px">'+btns+'</div></td>';
      }).join('');
      var linksRow='<tr><th class="ail-cmp-rowkey" scope="row">Links</th>'+linkCells+'</tr>';
      $('#ailCmpBody').innerHTML='<div class="ail-cmp-wrap"><table class="ail-cmp-table"><thead>'+head+'</thead><tbody>'+body+linksRow+'</tbody></table></div>'+
        (picks.length<CMP_MAX?'<a class="ail-cmp-add" href="#/c/llm">'+ICON_BACK+' Add more models from the LLM library</a>':'');
      // remove-column handlers
      $$('#ailCmpBody [data-rm]').forEach(function(b){ b.addEventListener('click',function(){ var sl=b.getAttribute('data-rm'); CMP.delete(sl); var left=picks.map(function(p){return p.slug;}).filter(function(s){return s!==sl;}); location.hash='#/compare?slugs='+enc(left.join(',')); }); });
    });
  }

  // expose for the router
  window.renderResourcesGuide = renderGuide;
  window.renderResourcesStack = renderStack;
  window.renderResourcesHub = renderHub;
  window.renderResourcesBrowse = renderBrowse;
  window.renderResourceDetail = renderDetail;
  window.renderResourcesCollection = renderCollection;
  window.renderResourcesCompare = renderCompare;
})();
</script>
<script>
(function(){
  // Decode a hash segment without ever throwing. decodeURIComponent() raises
  // "URI malformed" on a literal or dangling '%', which would abort route() and
  // leave the detail/collection page blank. Fall back to the raw text so the
  // exact-slug lookup still runs (and can show a clean "not found" if needed).
  function safeDecode(s){ try{ return decodeURIComponent(s); }catch(_){ return s; } }
  function route(){
    var h=location.hash||'';
    var pg = h.indexOf('#/r/')===0 ? 'page-resource' : 'page-aivault';
    document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
    var el=document.getElementById(pg); if(el) el.classList.add('active');
    // hide the floating compare bar whenever we leave the LLM browse view
    if(!/^#\/c\/llm(\?|$)/.test(h)){ var _cb=document.getElementById('ailCmpBar'); if(_cb) _cb.classList.remove('is-show'); }
    if(pg==='page-resource'){ window.renderResourceDetail(safeDecode(h.slice(4))); }
    else if(h.indexOf('#/guide')===0){ window.renderResourcesGuide(); }
    else if(h.indexOf('#/stack')===0){ window.renderResourcesStack(); }
    else if(h.indexOf('#/compare')===0){ var _ci=h.indexOf('?'); window.renderResourcesCompare(_ci>=0?h.slice(_ci+1):''); }
    else { var mc=h.match(/^#\/collection\/([^/?]+)/); var m=h.match(/^#\/c\/([^/?]+)/); if(mc) window.renderResourcesCollection(safeDecode(mc[1])); else if(m) window.renderResourcesBrowse(m[1]); else window.renderResourcesHub(); }
    if(pg!=='page-resource') window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',route);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',route); else route();

  // ===== dark-mode toggle =====
  (function(){
    var btn=document.getElementById('ailThemeToggle');
    if(!btn) return;
    function cur(){ return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light'; }
    function apply(t){ if(t==='dark') document.documentElement.setAttribute('data-theme','dark'); else document.documentElement.removeAttribute('data-theme'); btn.setAttribute('aria-pressed', t==='dark'?'true':'false'); }
    apply(cur());
    btn.addEventListener('click',function(){ var t=cur()==='dark'?'light':'dark'; apply(t); try{localStorage.setItem('ail-theme',t);}catch(e){} });
    // follow OS changes only if user hasn't explicitly chosen
    if(window.matchMedia){ var mq=window.matchMedia('(prefers-color-scheme:dark)'); var on=function(e){ var saved; try{saved=localStorage.getItem('ail-theme');}catch(_){ } if(!saved) apply(e.matches?'dark':'light'); }; if(mq.addEventListener) mq.addEventListener('change',on); else if(mq.addListener) mq.addListener(on); }
  })();
})();
</script>
