<style>
:root{--forge-blue:#1A6AFF;--brand-blue:#1A6AFF}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#fbfbfd;color:#0c1322;-webkit-font-smoothing:antialiased}
.ailnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 24px;background:rgba(251,251,253,.86);backdrop-filter:blur(10px);border-bottom:1px solid #eceef3}
.ailnav-brand{display:flex;align-items:center;gap:9px;font:700 16px 'DM Sans';text-decoration:none;color:#0c1322}
.ailnav-mark{width:27px;height:27px;border-radius:7px;background:var(--forge-blue);color:#fff;display:grid;place-items:center;font:800 14px 'DM Sans'}
.ailnav-links{display:flex;gap:20px;font-size:13.5px;font-weight:600;flex-wrap:wrap}
.ailnav-links a{text-decoration:none;color:#5b6470;white-space:nowrap}
.ailnav-links a:hover{color:var(--forge-blue)}
.ailfoot{border-top:1px solid #eceef3;padding:30px 24px;text-align:center;color:#8a93a3;font-size:13px;line-height:1.6}
.ailfoot a{color:var(--forge-blue);text-decoration:none}
.page{display:none}
.page.active{display:block}
@media(max-width:560px){.ailnav-links a:last-child{display:none}}
.ail-wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.ail-hero{padding:104px 0 28px}
.ail-back{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 'DM Sans',sans-serif;color:#5b6470;text-decoration:none;margin-bottom:18px}
.ail-back:hover{color:var(--forge-blue,#1A6AFF)}
.ail-eyebrow{font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:var(--forge-blue,#1A6AFF)}
.ail-h1{font:700 clamp(32px,5vw,56px)/1.05 'DM Sans',sans-serif;margin:14px 0 0;letter-spacing:-.02em;color:#0c1322}
.ail-h1 em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--forge-blue,#1A6AFF)}
.ail-lede{max-width:64ch;margin:16px 0 0;font-size:17px;line-height:1.5;color:#5b6470}
.ail-search{position:relative;margin:26px 0 0;max-width:680px}
.ail-search input{width:100%;height:54px;border:1.5px solid #e2e6ee;border-radius:14px;padding:0 18px 0 48px;font-size:16px;background:#fff;color:#0c1322;transition:border-color .15s,box-shadow .15s}
.ail-search input:focus{outline:none;border-color:var(--forge-blue,#1A6AFF);box-shadow:0 0 0 4px rgba(26,106,255,.12)}
.ail-search > svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:#9aa3b2;pointer-events:none}
.ail-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:32px 0 80px}
.ail-tile{display:block;text-decoration:none;color:inherit;border:1.5px solid #e7eaf1;border-radius:18px;padding:22px;background:#fff;transition:transform .15s,box-shadow .15s,border-color .15s}
.ail-tile:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(20,30,55,.10);border-color:#cdd6e6}
.ail-tile-ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:23px;background:rgba(26,106,255,.09)}
.ail-tile-name{font:700 21px/1.1 'DM Sans';margin:15px 0 0;color:#0c1322}
.ail-tile-count{font:600 13px/1 'JetBrains Mono',monospace;color:var(--forge-blue,#1A6AFF);margin:7px 0 0}
.ail-tile-blurb{font-size:14px;line-height:1.45;color:#5b6470;margin:10px 0 0}
.ail-gres{margin:18px 0 80px;max-width:680px}
.ail-gres-row{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid #eaecf2;border-radius:12px;margin-bottom:8px;text-decoration:none;color:inherit;background:#fff}
.ail-gres-row:hover{border-color:#c9d3e6;background:#fafbff}
.ail-gres-badge{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 13px/1 'DM Sans';color:#fff}
.ail-gres-name{font:600 15px/1.2 'DM Sans';color:#0c1322}
.ail-gres-meta{font-size:12.5px;color:#8a93a3;margin-top:2px}
.ail-gres-cat{margin-left:auto;flex:none;font:600 11px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.5px;color:#9aa3b2}
.ail-layout{display:grid;grid-template-columns:230px 1fr;gap:34px;align-items:start;padding-bottom:90px}
.ail-rail{position:sticky;top:84px}
.ail-rail-grp{margin-bottom:22px}
.ail-rail-label{font:700 11px/1 'JetBrains Mono',monospace;letter-spacing:1.4px;text-transform:uppercase;color:#9aa3b2;margin-bottom:10px}
.ail-facet{display:inline-flex;align-items:center;gap:6px;border:1px solid #e2e6ee;background:#fff;border-radius:999px;padding:6px 11px;font:500 13px/1 'DM Sans';color:#3b4453;cursor:pointer;margin:0 6px 6px 0;transition:all .12s}
.ail-facet:hover{border-color:#bcc7da}
.ail-facet.is-on{background:var(--forge-blue,#1A6AFF);border-color:var(--forge-blue,#1A6AFF);color:#fff}
.ail-facet .ct{font:600 11px/1 'JetBrains Mono',monospace;opacity:.6}
.ail-facet.is-on .ct{opacity:.85}
.ail-main-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.ail-count{font:600 14px/1 'JetBrains Mono',monospace;color:#8a93a3}
.ail-chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 16px;min-height:0}
.ail-chip-active{display:inline-flex;align-items:center;gap:6px;background:rgba(26,106,255,.08);color:var(--forge-blue,#1A6AFF);border:1px solid rgba(26,106,255,.22);border-radius:999px;padding:5px 10px;font:600 12.5px/1 'DM Sans';cursor:pointer}
.ail-chip-active:hover{background:rgba(26,106,255,.14)}
.ail-clear{background:none;border:none;color:#8a93a3;font:600 12.5px/1 'DM Sans';cursor:pointer;padding:5px 4px;text-decoration:underline}
.ail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ail-card{display:flex;flex-direction:column;text-decoration:none;color:inherit;border:1.5px solid #e7eaf1;border-radius:16px;padding:18px;background:#fff;transition:transform .14s,box-shadow .14s,border-color .14s}
.ail-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(20,30,55,.09);border-color:#cdd6e6}
.ail-card-top{display:flex;gap:12px;align-items:center}
.ail-card-badge{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font:700 16px/1 'DM Sans';color:#fff}
.ail-card-name{font:700 16px/1.2 'DM Sans';color:#0c1322;word-break:break-word}
.ail-card-meta{font-size:12.5px;color:#8a93a3;margin-top:2px}
.ail-card-desc{font-size:13.5px;line-height:1.5;color:#5b6470;margin:12px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ail-card-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:13px}
.ail-chip{font:600 11px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.4px;color:#7a8497;background:#f1f3f8;border-radius:6px;padding:5px 8px}
.ail-perk{font:600 11.5px/1 'DM Sans';color:#1a7f4b;background:rgba(26,160,90,.10);border-radius:6px;padding:5px 8px;margin-left:auto}
.ail-pager{display:flex;justify-content:center;align-items:center;gap:6px;margin:32px 0 0;flex-wrap:wrap}
.ail-pager button{min-width:38px;height:38px;border:1px solid #e2e6ee;background:#fff;border-radius:9px;font:600 13px/1 'DM Sans';color:#3b4453;cursor:pointer;padding:0 10px}
.ail-pager button:hover:not(:disabled){border-color:var(--forge-blue,#1A6AFF);color:var(--forge-blue,#1A6AFF)}
.ail-pager button.is-cur{background:var(--forge-blue,#1A6AFF);border-color:var(--forge-blue,#1A6AFF);color:#fff}
.ail-pager button:disabled{opacity:.4;cursor:default}
.ail-empty{padding:54px 20px;text-align:center;border:1px dashed #d9deea;border-radius:16px;color:#5b6470}
.ail-empty button{margin-top:14px}
.ail-load{padding:60px 20px;text-align:center;color:#9aa3b2;font:600 14px 'JetBrains Mono',monospace}
/* resource detail */
.ail-det{max-width:860px;margin:0 auto;padding:96px 24px 90px}
.ail-det-head{display:flex;gap:16px;align-items:flex-start}
.ail-det-badge{flex:none;width:62px;height:62px;border-radius:16px;display:grid;place-items:center;font:700 26px/1 'DM Sans';color:#fff}
.ail-det h1{font:700 clamp(26px,4vw,40px)/1.08 'DM Sans';margin:0;letter-spacing:-.02em;color:#0c1322;word-break:break-word}
.ail-det-cat{font:600 12px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:var(--forge-blue,#1A6AFF);margin-bottom:8px}
.ail-det-desc{font-size:17px;line-height:1.6;color:#3b4453;margin:22px 0 0}
.ail-install{margin:24px 0 0;background:#0c1322;border-radius:13px;padding:16px 18px;display:flex;align-items:center;gap:12px}
.ail-install code{font:500 13.5px/1.4 'JetBrains Mono',monospace;color:#cfe0ff;flex:1;word-break:break-all}
.ail-install button{flex:none;background:var(--forge-blue,#1A6AFF);color:#fff;border:none;border-radius:8px;padding:9px 14px;font:600 13px 'DM Sans';cursor:pointer}
.ail-meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:#e7eaf1;border:1px solid #e7eaf1;border-radius:13px;overflow:hidden;margin:24px 0 0}
.ail-meta-cell{background:#fff;padding:14px 16px}
.ail-meta-k{font:600 11px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.6px;color:#9aa3b2}
.ail-meta-v{font:600 15px/1.3 'DM Sans';color:#0c1322;margin-top:5px;word-break:break-word}
.ail-ww{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 0}
.ail-ww span{font:600 12.5px/1 'DM Sans';background:#eef2fb;color:#3b4453;border-radius:999px;padding:7px 12px}
.ail-links{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 0}
.ail-links a{display:inline-flex;align-items:center;gap:7px;border:1.5px solid #e2e6ee;border-radius:10px;padding:10px 15px;font:600 13.5px 'DM Sans';color:#0c1322;text-decoration:none}
.ail-links a:hover{border-color:var(--forge-blue,#1A6AFF);color:var(--forge-blue,#1A6AFF)}
.ail-xlink{margin:28px 0 0;border-radius:16px;padding:22px 24px;background:linear-gradient(135deg,rgba(26,160,90,.10),rgba(26,106,255,.07));border:1.5px solid rgba(26,160,90,.22)}
.ail-xlink-k{font:600 12px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:#1a7f4b}
.ail-xlink-h{font:700 19px/1.25 'DM Sans';color:#0c1322;margin:8px 0 0}
.ail-xlink a{display:inline-flex;margin-top:14px;background:#0c1322;color:#fff;text-decoration:none;border-radius:10px;padding:11px 18px;font:600 14px 'DM Sans'}
.ail-vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;margin:24px 0 0;background:#000}
.ail-vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (max-width:880px){
  .ail-layout{grid-template-columns:1fr;gap:8px}
  .ail-rail{position:static;top:auto;display:flex;gap:18px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .ail-rail-grp{margin-bottom:8px;flex:none}
  .ail-tiles{grid-template-columns:1fr}
  .ail-grid{grid-template-columns:1fr}
  .ail-hero{padding:84px 0 18px}
}
@media (hover:none){ .ail-card-cta{opacity:1} }

</style>
</head>
<body>

    <a href="https://promptvault.vercel.app/#/perks" target="_blank" rel="noopener">Startup perks ↗</a>
    <a href="https://leveluplearning.in" target="_blank" rel="noopener">leveluplearning.in ↗</a>
  </div>
</nav>
<div class="page active" id="page-aivault"><div id="aivaultHost"></div></div>
<div class="page" id="page-resource"><div id="resourceHost"></div></div>
<footer class="ailfoot">© 2026 LevelUp Learning · <strong>LevelUp AI Library</strong> · Free for LevelUp AI students<br>Catalog snapshot from explainx.ai · 2026-06-26 · 14,465 resources</footer>
<script>
(function(){
  'use strict';
  var DATA_BASE = '/aivault/data/ai-resources/';     // relative — resolves under any base path (root or /aivault/)
  var PAGE = 24;
  var $ = function(s,r){return (r||document).querySelector(s);};
  var esc = function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var debounce = function(fn,ms){var t;return function(){var a=arguments,c=this;clearTimeout(t);t=setTimeout(function(){fn.apply(c,a);},ms);};};
  function color(s){var h=0;s=String(s||'');for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return 'hsl('+(h%360)+' 60% 50%)';}

  var CATS = [
    {key:'skill',      label:'Skills',      icon:'⚡', count:7748, blurb:'Install-ready agent skills for Claude Code, Cursor, Codex & 23 more tools.',
      facets:[{f:'works_with',label:'Works with',split:';',top:10},{f:'skill_category',label:'Category',top:12}]},
    {key:'tool',       label:'Tools',       icon:'🛠️', count:3537, blurb:'AI tools for every task — many with a matching credit perk.',
      facets:[{f:'task_category',label:'Task',top:18}]},
    {key:'mcp_server', label:'MCP Servers', icon:'🔌', count:1725, blurb:'Connect your agents to databases, APIs & services.',
      facets:[{f:'categories',label:'Category',split:/[;,]/,top:16}]},
    {key:'llm',        label:'LLMs',        icon:'🧠', count:585,  blurb:'Compare models by provider, size, context & open/closed weights.',
      facets:[{f:'weights',label:'Weights'},{f:'kind',label:'Type',top:10},{f:'provider',label:'Provider',top:12}]},
    {key:'agent',      label:'Agents',      icon:'🤖', count:800,  blurb:'Prebuilt agents & automation templates.',
      facets:[{f:'agent_category',label:'Category',top:14},{f:'open_source',label:'Open source'}]},
    {key:'design',     label:'Designs',     icon:'🎨', count:70,   blurb:'DESIGN.md systems your design agents can read.', facets:[]}
  ];
  var CAT_BY = {}; CATS.forEach(function(c){CAT_BY[c.key]=c;});

  // --- data loading (cached promises) ---
  var cache = {}, indexP = null, perksP = null;
  function loadCat(key){
    if(cache[key]) return cache[key];
    cache[key] = fetch(DATA_BASE+key+'.json').then(function(r){return r.json();}).then(function(rows){
      rows.forEach(function(x){ x._hay = (x.name+' '+(x.description||'')+' '+Object.values(x.extra||{}).join(' ')).toLowerCase(); });
      return rows;
    }).catch(function(){return [];});
    return cache[key];
  }
  function loadIndex(){ return indexP || (indexP = fetch(DATA_BASE+'index.json').then(function(r){return r.json();}).then(function(rows){
    rows.forEach(function(x){ x._hay=(x.n+' '+(x.d||'')).toLowerCase(); }); return rows; }).catch(function(){return [];})); }
  function loadPerks(){ return perksP || (perksP = fetch(DATA_BASE+'perks_resource_matches.json').then(function(r){return r.json();}).catch(function(){return [];})); }

  // --- search scoring (tokenized substring) ---
  function search(rows, q, hayKey, nameKey){
    q=(q||'').trim().toLowerCase(); if(!q) return rows;
    var toks=q.split(/\s+/);
    var out=[];
    for(var i=0;i<rows.length;i++){
      var r=rows[i], hay=r[hayKey], ok=true, sc=0, nm=(r[nameKey]||'').toLowerCase();
      for(var t=0;t<toks.length;t++){ if(hay.indexOf(toks[t])<0){ok=false;break;} }
      if(!ok) continue;
      if(nm===q) sc=100; else if(nm.indexOf(q)===0) sc=60; else if(nm.indexOf(q)>=0) sc=30; else sc=10;
      out.push([sc,r]);
    }
    out.sort(function(a,b){ return b[0]-a[0] || String(a[1][nameKey]).localeCompare(String(b[1][nameKey])); });
    return out.map(function(p){return p[1];});
  }

  // =========================================================
  // HUB
  // =========================================================
  function renderHub(){
    var host=$('#aivaultHost'); if(!host) return;
    host.innerHTML =
      '<div class="ail-wrap"><div class="ail-hero">'+
        '<div class="ail-eyebrow">LevelUp AI Library · Free for students</div>'+
        '<h1 class="ail-h1">14,465 AI <em>resources</em>, in one place.</h1>'+
        '<p class="ail-lede">Every agent skill, AI tool, MCP server, LLM, agent and design system — searchable, categorized, and free. No signup, nothing locked. Built for LevelUp AI students.</p>'+
        '<div class="ail-search">'+ICON_SEARCH+'<input id="ailGlobal" type="text" placeholder="Search all 14,465 resources…" autocomplete="off" aria-label="Search the AI Library"></div>'+
        '<div class="ail-gres" id="ailGlobalRes"></div>'+
        '<div class="ail-tiles" id="ailTiles">'+ CATS.map(function(c){
          return '<a class="ail-tile" href="#/c/'+c.key+'">'+
            '<div class="ail-tile-ico">'+c.icon+'</div>'+
            '<div class="ail-tile-name">'+c.label+'</div>'+
            '<div class="ail-tile-count">'+c.count.toLocaleString()+' →</div>'+
            '<div class="ail-tile-blurb">'+esc(c.blurb)+'</div></a>';
        }).join('') +'</div>'+
      '</div></div>';
    var gi=$('#ailGlobal'), gr=$('#ailGlobalRes');
    var run=debounce(function(){
      var q=gi.value.trim();
      if(q.length<2){ gr.innerHTML=''; return; }
      gr.innerHTML='<div class="ail-load">Searching…</div>';
      loadIndex().then(function(idx){
        if(gi.value.trim()!==q) return;
        var res=search(idx,q,'_hay','n').slice(0,40);
        if(!res.length){ gr.innerHTML='<div class="ail-empty">No matches for “'+esc(q)+'”.</div>'; return; }
        gr.innerHTML=res.map(function(r){var cc=CAT_BY[r.c]||{label:r.c};
          return '<a class="ail-gres-row" href="#/r/'+esc(r.s)+'">'+
            '<span class="ail-gres-badge" style="background:'+color(r.n)+'">'+esc((r.n||'?').charAt(0).toUpperCase())+'</span>'+
            '<div style="min-width:0"><div class="ail-gres-name">'+esc(r.n)+'</div><div class="ail-gres-meta">'+esc(r.d||'')+'</div></div>'+
            '<span class="ail-gres-cat">'+esc(cc.label)+'</span></a>';
        }).join('');
      });
    },180);
    gi.addEventListener('input',run);
    gi.focus();
  }

  // =========================================================
  // BROWSE
  // =========================================================
  var B = null; // {key, rows, query, facets:{field:Set}, page}
  function computeFacets(rows, def){
    var m={};
    rows.forEach(function(r){
      var v=(r.extra||{})[def.f];
      if(v==null||v==='') return;
      var vals = def.split ? String(v).split(def.split) : [v];
      vals.forEach(function(x){ x=String(x).trim(); if(x){ m[x]=(m[x]||0)+1; } });
    });
    return Object.keys(m).map(function(k){return {v:k,n:m[k]};}).sort(function(a,b){return b.n-a.n;}).slice(0, def.top||99);
  }
  function applyBrowse(){
    var def=CAT_BY[B.key];
    var rows=B.rows;
    // facets (AND across fields, OR within field)
    def.facets.forEach(function(fd){
      var sel=B.facets[fd.f];
      if(sel && sel.size){
        rows=rows.filter(function(r){
          var v=(r.extra||{})[fd.f]; if(v==null) return false;
          var vals=fd.split?String(v).split(fd.split).map(function(x){return x.trim();}):[String(v).trim()];
          for(var s of sel){ if(vals.indexOf(s)>=0) return true; } return false;
        });
      }
    });
    rows=search(rows,B.query,'_hay','name');
    var total=rows.length;
    var pages=Math.max(1,Math.ceil(total/PAGE));
    if(B.page>=pages) B.page=0;
    var slice=rows.slice(B.page*PAGE,B.page*PAGE+PAGE);
    $('#ailCount').textContent = total.toLocaleString()+' '+(total===1?'result':'results');
    // active chips
    var chips=[];
    Object.keys(B.facets).forEach(function(f){ (B.facets[f]||new Set()).forEach(function(v){
      chips.push('<button class="ail-chip-active" data-f="'+esc(f)+'" data-v="'+esc(v)+'">'+esc(v)+' ✕</button>'); }); });
    if(B.query) chips.push('<span class="ail-chip-active" style="cursor:default">“'+esc(B.query)+'”</span>');
    $('#ailChips').innerHTML = chips.join('') + (chips.length?'<button class="ail-clear" id="ailClear">Clear all</button>':'');
    // results
    var rc=$('#ailResults');
    if(!slice.length){ rc.innerHTML='<div class="ail-empty" role="status">No resources match these filters.<br><button class="btn btn-primary btn-sm" id="ailReset">Clear filters</button></div>'; }
    else rc.innerHTML='<div class="ail-grid">'+slice.map(cardHTML).join('')+'</div>'+pagerHTML(B.page,pages);
    // perk badges (async)
    markPerks(slice);
  }
  function metaLine(r){
    var e=r.extra||{};
    if(r.category==='skill') return e.works_with?String(e.works_with).split(';').slice(0,3).join(' · '):(e.skill_category||'Agent skill');
    if(r.category==='tool') return e.task_category||'AI tool';
    if(r.category==='mcp_server') return (String(e.categories||'').split(/[;,]/)[0]||'MCP server')+(e.vendor?' · '+e.vendor:'');
    if(r.category==='llm') return [e.provider,e.parameters,e.weights].filter(Boolean).join(' · ')||'LLM';
    if(r.category==='agent') return e.agent_category||'AI agent';
    if(r.category==='design') return 'Design system';
    return '';
  }
  function cardHTML(r){
    return '<a class="ail-card" href="#/r/'+esc(r.slug)+'" data-slug="'+esc(r.slug)+'">'+
      '<div class="ail-card-top">'+
        '<span class="ail-card-badge" style="background:'+color(r.name)+'">'+esc((r.name||'?').charAt(0).toUpperCase())+'</span>'+
        '<div style="min-width:0"><div class="ail-card-name">'+esc(r.name)+'</div><div class="ail-card-meta">'+esc(metaLine(r))+'</div></div>'+
      '</div>'+
      '<p class="ail-card-desc">'+esc((r.description||'').split('|')[0])+'</p>'+
      '<div class="ail-card-foot"><span class="ail-chip">'+esc((CAT_BY[r.category]||{label:r.category}).label)+'</span>'+
        '<span class="ail-perk" data-perkfor="'+esc(r.primary_url||'')+'" hidden></span></div></a>';
  }
  function pagerHTML(page,pages){
    if(pages<=1) return '';
    var btns='<button '+(page===0?'disabled':'')+' data-pg="'+(page-1)+'">←</button>';
    var win=[]; for(var i=0;i<pages;i++){ if(i<2||i>=pages-2||Math.abs(i-page)<=1) win.push(i); }
    var last=-1;
    win.forEach(function(i){ if(i-last>1) btns+='<span style="color:#c2cad8">…</span>'; btns+='<button class="'+(i===page?'is-cur':'')+'" data-pg="'+i+'">'+(i+1)+'</button>'; last=i; });
    btns+='<button '+(page>=pages-1?'disabled':'')+' data-pg="'+(page+1)+'">→</button>';
    return '<div class="ail-pager">'+btns+'</div>';
  }
  function markPerks(slice){
    loadPerks().then(function(matches){
      var byUrl={}; matches.forEach(function(m){ if(m.resource_explainx_url) byUrl[m.resource_explainx_url]=m; });
      $$('.ail-perk').forEach(function(el){ var u=el.getAttribute('data-perkfor'); if(u&&byUrl[u]){ el.textContent='💸 perk'; el.hidden=false; } });
    });
  }
  function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}

  function renderBrowse(key){
    var host=$('#aivaultHost'); if(!host) return;
    var def=CAT_BY[key]; if(!def){ renderHub(); return; }
    B={key:key, rows:[], query:'', facets:{}, page:0};
    host.innerHTML=
      '<div class="ail-wrap"><div class="ail-hero" style="padding-bottom:14px">'+
        '<a class="ail-back" href="#/">'+ICON_BACK+' AI Library</a>'+
        '<h1 class="ail-h1">'+def.icon+' '+def.label+'</h1>'+
        '<p class="ail-lede">'+esc(def.blurb)+'</p>'+
        '<div class="ail-search">'+ICON_SEARCH+'<input id="ailQ" type="text" placeholder="Search '+def.count.toLocaleString()+' '+def.label.toLowerCase()+'…" autocomplete="off" aria-label="Search '+def.label+'"></div>'+
      '</div>'+
      '<div class="ail-layout">'+
        '<aside class="ail-rail" id="ailRail"></aside>'+
        '<div class="ail-main">'+
          '<div class="ail-main-head"><div class="ail-count" id="ailCount">Loading…</div></div>'+
          '<div class="ail-chips" id="ailChips"></div>'+
          '<div id="ailResults"><div class="ail-load">Loading '+def.label.toLowerCase()+'…</div></div>'+
        '</div>'+
      '</div></div>';

    var q=$('#ailQ');
    q.addEventListener('input',debounce(function(){ B.query=q.value; B.page=0; applyBrowse(); },150));
    q.addEventListener('keydown',function(e){ if(e.key==='Escape'){ q.value=''; B.query=''; B.page=0; applyBrowse(); } });

    // event delegation on host
    host.addEventListener('click',function(e){
      var pg=e.target.closest&&e.target.closest('[data-pg]');
      if(pg){ B.page=+pg.getAttribute('data-pg'); applyBrowse(); window.scrollTo({top:0,behavior:'smooth'}); return; }
      var ca=e.target.closest&&e.target.closest('.ail-chip-active[data-f]');
      if(ca){ var f=ca.getAttribute('data-f'), v=ca.getAttribute('data-v'); if(B.facets[f]){B.facets[f].delete(v);} B.page=0; renderRail(); applyBrowse(); return; }
      if(e.target.id==='ailClear'||e.target.id==='ailReset'){ B.facets={}; B.query=''; var qi=$('#ailQ'); if(qi)qi.value=''; B.page=0; renderRail(); applyBrowse(); return; }
      var fc=e.target.closest&&e.target.closest('.ail-facet');
      if(fc){ var ff=fc.getAttribute('data-field'), fv=fc.getAttribute('data-val'); if(!B.facets[ff])B.facets[ff]=new Set(); if(B.facets[ff].has(fv))B.facets[ff].delete(fv); else B.facets[ff].add(fv); B.page=0; renderRail(); applyBrowse(); return; }
    });

    loadCat(key).then(function(rows){
      if(!B||B.key!==key) return;
      B.rows=rows; renderRail(); applyBrowse();
    });
  }
  function renderRail(){
    var rail=$('#ailRail'); if(!rail||!B) return;
    var def=CAT_BY[B.key];
    if(!def.facets.length){ rail.innerHTML=''; return; }
    rail.innerHTML = def.facets.map(function(fd){
      var vals=computeFacets(B.rows,fd);
      if(!vals.length) return '';
      return '<div class="ail-rail-grp"><div class="ail-rail-label">'+esc(fd.label)+'</div>'+
        vals.map(function(o){
          var on=B.facets[fd.f]&&B.facets[fd.f].has(o.v);
          return '<button class="ail-facet'+(on?' is-on':'')+'" data-field="'+esc(fd.f)+'" data-val="'+esc(o.v)+'">'+esc(o.v)+' <span class="ct">'+o.n+'</span></button>';
        }).join('')+'</div>';
    }).join('');
  }

  // =========================================================
  // DETAIL
  // =========================================================
  function renderDetail(slug){
    var host=$('#resourceHost'); if(!host) return;
    host.innerHTML='<div class="ail-det"><div class="ail-load">Loading…</div></div>';
    var key=String(slug).split('/')[0];
    if(!CAT_BY[key]){ host.innerHTML='<div class="ail-det"><a class="ail-back" href="#/">'+ICON_BACK+' AI Library</a><h1 class="ail-h1">Not found</h1></div>'; return; }
    loadCat(key).then(function(rows){
      var r=null; for(var i=0;i<rows.length;i++){ if(rows[i].slug===slug){ r=rows[i]; break; } }
      if(!r){ host.innerHTML='<div class="ail-det"><a class="ail-back" href="#/">'+ICON_BACK+' AI Library</a><h1 class="ail-h1">Resource not found</h1><p class="ail-det-desc">It may have been renamed. <a href="#/c/'+key+'">Browse '+esc(CAT_BY[key].label)+'</a>.</p></div>'; return; }
      var e=r.extra||{}, def=CAT_BY[key];
      var meta=[];
      if(key==='llm'){ if(e.provider)meta.push(['Provider',e.provider]); if(e.parameters)meta.push(['Parameters',e.parameters]); if(e.context_length)meta.push(['Context',e.context_length]); if(e.weights)meta.push(['Weights',e.weights==='open'?'Open':'Closed']); if(e.kind)meta.push(['Type',e.kind]); }
      if(key==='skill'){ if(e.skill_category)meta.push(['Category',e.skill_category]); if(e.owner)meta.push(['Author',e.owner]); if(e.last_updated)meta.push(['Updated',e.last_updated]); }
      if(key==='tool'&&e.task_category)meta.push(['Task',e.task_category]);
      if(key==='mcp_server'){ if(e.vendor)meta.push(['Vendor',e.vendor]); if(e.categories)meta.push(['Categories',String(e.categories).split(/[;,]/).slice(0,3).join(', ')]); }
      if(key==='agent'){ if(e.agent_category)meta.push(['Category',e.agent_category]); if(e.open_source)meta.push(['Open source',e.open_source==='yes'?'Yes':e.open_source]); if(e.author)meta.push(['Author',e.author]); }

      var descParts=String(r.description||'').split('|').map(function(s){return s.trim();}).filter(Boolean);
      var html='<div class="ail-det">'+
        '<a class="ail-back" href="#/c/'+key+'">'+ICON_BACK+' '+esc(def.label)+'</a>'+
        '<div class="ail-det-head"><span class="ail-det-badge" style="background:'+color(r.name)+'">'+esc((r.name||'?').charAt(0).toUpperCase())+'</span>'+
          '<div style="min-width:0"><div class="ail-det-cat">'+esc(def.label)+'</div><h1>'+esc(r.name)+'</h1></div></div>'+
        (descParts.length?'<div class="ail-det-desc">'+descParts.map(esc).join('<br><br>')+'</div>':'');
      if(key==='skill'&&e.install_command){
        html+='<div class="ail-install"><code id="ailCmd">'+esc(e.install_command)+'</code><button data-copy="'+esc(e.install_command)+'">Copy</button></div>';
      }
      if(meta.length){ html+='<div class="ail-meta-grid">'+meta.map(function(m){return '<div class="ail-meta-cell"><div class="ail-meta-k">'+esc(m[0])+'</div><div class="ail-meta-v">'+esc(m[1])+'</div></div>';}).join('')+'</div>'; }
      if(key==='skill'&&e.works_with){ html+='<div class="ail-ww">'+String(e.works_with).split(';').map(function(w){w=w.trim();return w?'<span>'+esc(w)+'</span>':'';}).join('')+'</div>'; }
      if(key==='skill'&&e.install_video_url){ html+='<div class="ail-vid"><iframe src="'+esc(e.install_video_url)+'" loading="lazy" allowfullscreen title="Install video"></iframe></div>'; }
      var links=[];
      if(r.external_url) links.push('<a href="'+esc(r.external_url)+'" target="_blank" rel="noopener">'+(key==='skill'||/github/.test(r.external_url)?'GitHub':'Website')+' ↗</a>');
      if(r.primary_url) links.push('<a href="'+esc(r.primary_url)+'" target="_blank" rel="noopener">View on explainx ↗</a>');
      if(links.length) html+='<div class="ail-links">'+links.join('')+'</div>';
      html+='<div id="ailXlink"></div>';
      if(key==='skill'){ html+='<p style="margin:26px 0 0;font-size:13.5px;color:#8a93a3">Universal install: <code style="font-family:\'JetBrains Mono\',monospace">npx skills init</code> → <code style="font-family:\'JetBrains Mono\',monospace">npx skills add '+esc(e.github_url||r.external_url||'')+' --skill '+esc(r.name)+'</code> → pick your platform.</p>'; }
      html+='</div>';
      host.innerHTML=html;
      window.scrollTo({top:0});
      // copy
      var cb=host.querySelector('[data-copy]');
      if(cb) cb.addEventListener('click',function(){ var txt=cb.getAttribute('data-copy'); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){cb.textContent='Copied';setTimeout(function(){cb.textContent='Copy';},1500);}).catch(function(){}); });
      // perk cross-link
      renderXlink(r);
    });
  }
  function renderXlink(r){
    var box=$('#ailXlink'); if(!box) return;
    loadPerks().then(function(matches){
      var m=null; for(var i=0;i<matches.length;i++){ if(matches[i].resource_explainx_url===r.primary_url || (matches[i].resource_name===r.name && matches[i].resource_category===r.category)){ m=matches[i]; break; } }
      if(!m) return;
      var slug=perkSlug(m.perk_company);
      box.innerHTML='<div class="ail-xlink"><div class="ail-xlink-k">💸 Save on this</div>'+
        '<div class="ail-xlink-h">'+esc(m.perk_company)+' has '+esc(m.perk_credits||'credits')+' available via LevelUp AI Perks.</div>'+
        '<a href="https://promptvault.vercel.app/#/perks" target="_blank" rel="noopener">See LevelUp AI Perks →</a>'+'</div>';
    });
  }
  function perkSlug(company){
    try{ if(typeof ALL_PERKS==='undefined') return null;
      var c=String(company||'').toLowerCase();
      for(var i=0;i<ALL_PERKS.length;i++){ if(String(ALL_PERKS[i].name||'').toLowerCase()===c || String(ALL_PERKS[i].company||'').toLowerCase()===c) return ALL_PERKS[i].slug; }
    }catch(_){}
    return null;
  }

  var ICON_SEARCH='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>';
  var ICON_BACK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';

  // expose for the router
  window.renderResourcesHub = renderHub;
  window.renderResourcesBrowse = renderBrowse;
  window.renderResourceDetail = renderDetail;
})();
</script>
<script>
(function(){
  function route(){
    var h=location.hash||'';
    var pg = h.indexOf('#/r/')===0 ? 'page-resource' : 'page-aivault';
    document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
    var el=document.getElementById(pg); if(el) el.classList.add('active');
    if(pg==='page-resource'){ window.renderResourceDetail(decodeURIComponent(h.slice(4))); }
    else { var m=h.match(/^#\/c\/([^/?]+)/); if(m) window.renderResourcesBrowse(m[1]); else window.renderResourcesHub(); }
    if(pg!=='page-resource') window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',route);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',route); else route();
})();
</script>
</body>
</html>
